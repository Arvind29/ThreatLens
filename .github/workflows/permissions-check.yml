name: ThreatLens Workflow Permissions Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate workflow permissions
        run: |
          echo "Workflow runs with read-only repository permissions."
          echo "Review any workflow that requests additional permissions."
